    transition-property: color, background-color, border-color, outline-color, text-decoration-color, fill, stroke, --tw-gradient-from, --tw-gradient-via, --tw-gradient-to, opacity, box-shadow, transform, translate, scale, rotate, filter, -webkit-backdrop-filter, backdrop-filter, display, content-visibility, overlay, pointer-events;
    transition-timing-function: var(--tw-ease, var(--default-transition-timing-function));
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }
  .select-none {
    -webkit-user-select: none;
    user-select: none;
  }
  @media (width >= 40rem) {
    .sm\:inline {
      display: inline;
    }
    .sm\:grid-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .sm\:grid-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .sm\:flex-row {
      flex-direction: row;
    }
    .sm\:text-2xl {
      font-size: var(--text-2xl);
      line-height: var(--tw-leading, var(--text-2xl--line-height));
    }
    .sm\:text-3xl {
      font-size: var(--text-3xl);
      line-height: var(--tw-leading, var(--text-3xl--line-height));
    }
    .sm\:text-base {
      font-size: var(--text-base);
      line-height: var(--tw-leading, var(--text-base--line-height));
    }
    .sm\:text-lg {
      font-size: var(--text-lg);
      line-height: var(--tw-leading, var(--text-lg--line-height));
    }
    .sm\:text-sm {
      font-size: var(--text-sm);
      line-height: var(--tw-leading, var(--text-sm--line-height));
    }
    .sm\:text-xl {
      font-size: var(--text-xl);
      line-height: var(--tw-leading, var(--text-xl--line-height));
    }
    .sm\:leading-8 {
      --tw-leading: calc(var(--spacing) * 8);
      line-height: calc(var(--spacing) * 8);
    }
  }
  @media (width >= 48rem) {
    .md\:w-52 {
      width: calc(var(--spacing) * 52);
    }
    .md\:w-56 {
      width: calc(var(--spacing) * 56);
    }
    .md\:w-60 {
      width: calc(var(--spacing) * 60);
    }
    .md\:grid-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .md\:grid-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .md\:grid-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .md\:flex-col {
      flex-direction: column;
    }
    .md\:flex-row {
      flex-direction: row;
    }
  }
}
:root {
  color-scheme: dark;
  --bg: #05030f;
  --panel: #17122f;
  --panel-2: #1f1940;
  --line: #2f2a55;
  --fg: #f2ecff;
  --muted: #a99fd0;
  --orange: #ff8a3d;
  --good: #7dffb0;
}
html, body, #root {
  height: 100%;
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}
body {
  font-family: var(--font-term);
  color: var(--fg);
  -webkit-font-smoothing: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
}
.pixelated {
  image-rendering: pixelated;
}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--color-sun);
  outline-offset: 2px;
}
@layer components {
  .px-btn {
    position: relative;
    font-family: var(--font-pixel);
    color: #f2ecff;
    background: #4a3f78;
    border: 0;
    padding: 14px 18px 12px;
    line-height: 1.4;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #1b1236;
    box-shadow: inset -4px -4px 0 #2a2150, inset 4px 4px 0 #7a6cb5, 0 0 0 3px #0b0816;
    cursor: pointer;
  }
  .px-btn:hover:not(:disabled) {
    background: #5d4fa0;
    color: #ffff8a;
  }
  .px-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 4px 4px 0 #2a2150, inset -4px -4px 0 #7a6cb5, 0 0 0 3px #0b0816;
  }
  .px-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .px-btn.on {
    background: #2f7a5a;
    box-shadow: inset -4px -4px 0 #1a4a36, inset 4px 4px 0 #5ac08a, 0 0 0 3px #0b0816;
  }
  .px-btn.ghost {
    background: #2a2348;
    box-shadow: inset -4px -4px 0 #17122f, inset 4px 4px 0 #4a3f78, 0 0 0 3px #0b0816;
  }
  .px-btn.danger {
    background: #8a3046;
    box-shadow: inset -4px -4px 0 #4a1428, inset 4px 4px 0 #c0506e, 0 0 0 3px #0b0816;
  }
  .px-panel {
    background: rgba(23, 18, 47, 0.97);
    box-shadow: inset -4px -4px 0 #0e0a20, inset 4px 4px 0 #3a2f6b, 0 0 0 3px #0b0816, 0 10px 0 rgba(0, 0, 0, 0.4);
  }
  .px-slot {
    background: var(--panel-2);
    box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 #3a2f6b;
  }
  .px-slot.sel {
    background: #2f2660;
    box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 var(--color-sun);
  }
  .px-bar {
    height: 10px;
    background: #0b0816;
    box-shadow: inset 0 0 0 2px #2f2a55;
    position: relative;
    overflow: hidden;
  }
  .px-bar > div {
    height: 100%;
    transition: width 300ms steps(6);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
  }
  input[type="range"].px-range {
    -webkit-appearance: none;
    appearance: none;
    height: 12px;
    background: #0b0816;
    box-shadow: inset 0 0 0 2px #3a2f6b;
  }
  input[type="range"].px-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 24px;
    background: var(--color-sun);
    box-shadow: inset -3px -3px 0 #b08a2a, 0 0 0 2px #0b0816;
    cursor: pointer;
  }
  input[type="range"].px-range::-moz-range-thumb {
    width: 18px;
    height: 24px;
    border: 0;
    border-radius: 0;
    background: var(--color-sun);
    cursor: pointer;
  }
  .px-select {
    font-family: var(--font-term);
    font-size: 1.4rem;
    background: var(--panel-2);
    color: var(--fg);
    border: 0;
    padding: 4px 8px;
    box-shadow: inset 0 0 0 2px #3a2f6b;
  }
  .chip {
    display: inline-block;
    font-family: var(--font-pixel);
    font-size: 8px;
    line-height: 1.6;
    padding: 3px 6px;
    background: #2a2348;
    color: var(--muted);
    box-shadow: inset 0 0 0 1px #3a2f6b;
  }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 5px;
    background: var(--color-alert);
    color: #fff;
    font-size: 8px;
  }
  .kbd {
    font-family: var(--font-pixel);
    font-size: 9px;
    padding: 4px 6px;
    background: var(--color-ink);
    color: var(--color-cyan);
    white-space: nowrap;
  }
  .link {
    color: var(--color-cyan);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .warn {
    padding: 8px 10px;
    background: #3a1420;
    color: #ffc0c8;
    font-size: 1.3rem;
    box-shadow: inset 0 0 0 2px #8a3046;
  }
  .status {
    font-family: var(--font-pixel);
    font-size: 8px;
    padding: 3px 6px;
    white-space: nowrap;
    background: #2a2348;
    color: var(--muted);
  }
  .status.available {
    background: #4a3f78;
    color: #fff;
  }
  .status.active {
    background: #1a4a6a;
    color: var(--color-cyan);
  }
  .status.complete {
    background: #2f7a5a;
    color: #fff;
    animation: blink 1s steps(1) infinite;
  }
  .status.claimed {
    background: #1f3a2a;
    color: var(--good);
  }
  .mission {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px;
    background: var(--panel-2);
    box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 #3a2f6b;
  }
  .mission.complete {
    box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 var(--good);
  }
  .mission.claimed, .mission.upcoming {
    opacity: 0.6;
  }
}
.modal-scrim {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(5, 3, 15, 0.62);
}
.mg-scrim {
  z-index: 45;
  padding: 8px;
  background: rgba(5, 3, 15, 0.85);
}
.mg-canvas {
  width: min(100%, 880px, calc((100dvh - 230px) * 16 / 9));

  max-width: 100%;
  box-shadow: 0 0 0 3px #0b0816, 0 0 0 5px #3a2f6b;
}
.win-panel {

  padding: 8px;

}
.game-root {

  height: 100%;
  width: 100%;
  overflow: hidden;
  background: #000;
}
.stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.menu-nav {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 11%;

  align-items: center;
  gap: 16px;
  padding: 0 16px;
}
.caption {

  top: 9%;
  transform: translateX(-50%);
  width: min(92%, 760px);
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 16px;
  background: rgba(8, 5, 22, 0.85);
  box-shadow: 0 0 0 3px #0b0816, inset 0 3px 0 #3a2f6b;

.skip {

  right: max(16px, env(safe-area-inset-right, 0px));

}

  top: 8px;

}
.hud-card {
  padding: 8px 10px;
  background: rgba(15, 11, 34, 0.86);

}
.energy {
  position: relative;
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  padding: 6px 8px;
  color: var(--color-sun);
  background: #2a2208;
  box-shadow: inset 0 0 0 2px #6a5410;

}
.energy.pulse {

}

.res-grid {

.suit {

.suit.low {

  animation: blink 0.8s steps(1) infinite;
}
.rad-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  font-size: 16px;
  line-height: 1;
  background: rgba(15, 11, 34, 0.85);
  color: #ffe08a;

.rad-chip:hover, .rad-chip:focus-visible {

}
.hud-btn:hover {

}
.next-day {

}
.toasts {

  left: 50%;
  top: 52px;

  align-items: center;
  gap: 4px;
  pointer-events: none;
}
.toast {
  padding: 6px 12px;
  font-size: 1.4rem;

.notice {

.saved {

}
.choice:hover {

.choice.disabled {

}

  height: 64px;

  font-size: 18px;
  color: #fff;
  background: rgba(42, 35, 72, 0.75);
  box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.35), inset 3px 3px 0 rgba(255, 255, 255, 0.15), 0 0 0 2px #0b0816;
  touch-action: none;
}
.tbtn.act {
  background: rgba(160, 120, 20, 0.85);
}
.tbtn:active {

}
.journal-art {
  width: 140px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2a1a2a;
  box-shadow: inset 0 0 0 2px #3a2f6b;
  flex-shrink: 0;
}
.journal-art img {

  max-height: 100px;
}
.silhouette {
  filter: brightness(0) opacity(0.6);
}
.ending-root {
  position: absolute;
  inset: 0;
  z-index: 60;
  overflow-y: auto;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
}
.ending-canvas {
  width: 100%;
  aspect-ratio: 480 / 150;
  box-shadow: 0 0 0 3px #0b0816, 0 0 0 5px #3a2f6b;
}
@keyframes blink {
  50% {
    opacity: 0.35;
  }
}
@keyframes fadein {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes floatup {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(-26px);
  }
}
@keyframes nudge {
  50% {
    transform: translateY(-3px);
  }
}
.fadein {
  animation: fadein 220ms steps(4) both;
}
.dialogue.fadein, .caption.fadein, .notice.fadein {
  animation-name: fadein-c;
}
@keyframes fadein-c {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.pop {
  animation: pop 240ms steps(4) both;
}
@media (max-width: 640px) {
  .hud-left {

  .hud-btn span.font-pixel {

  }
  .res-grid {
    font-size: 1rem;
  }
  .next-day {
    bottom: 90px;
  }
}
@media (max-height: 480px) {

    display: none;

  }

.rotate-tip {
  display: none;
}

  .rotate-tip {
    display: block;
    position: absolute;
    left: 50%;
    top: 66%;
    transform: translateX(-50%);
    padding: 8px 12px;
    font-size: 1.3rem;
    text-align: center;
    color: var(--muted);
    background: rgba(15, 11, 34, 0.85);
    white-space: nowrap;
    pointer-events: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
.chip.sim {
  color: #ffe08a;
  background: #3a2a10;
  box-shadow: inset 0 0 0 1px #8a6a20;
}
.sci-block {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--panel-2);
  box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 #3a2f6b;
}
.sci-label {
  font-family: var(--font-pixel);
  font-size: 8px;
  margin-bottom: 6px;
}
.sci-block.real .sci-label {
  color: #7dffb0;
}
.sci-block.nasa .sci-label {
  color: var(--color-cyan);
}
.sci-block.game .sci-label {
  color: #ffe08a;
}
.wrs-flow {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  counter-reset: none;
}
.wrs-flow > li {
  position: relative;
}
.wrs-flow > li.on {
  box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 #3a8dff;
}
.wrs-flow > li:not(:last-child)::after {
  content: '▸';
  position: absolute;
  right: -9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-cyan);
  font-size: 14px;
}
@media (max-width: 640px) {
  .wrs-flow {
    grid-template-columns: minmax(0, 1fr);
  }
  .wrs-flow > li:not(:last-child)::after {
    content: '▾';
    right: 50%;
    top: auto;
    bottom: -12px;
    transform: none;
  }
}
.analyzer-screen {
  position: relative;
  height: 96px;
  background: #0b1020;
  box-shadow: inset 0 0 0 2px #2a3a5a;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.analyzer-screen .beam {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  background: #5ff3ff;
  box-shadow: 0 0 10px #5ff3ff, 0 0 24px #c48cff;
  transition: left 0.08s linear;
}
.link-grid {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 4px 12px;
}
.link-grid dt {
  font-family: var(--font-pixel);
  font-size: 8px;
  color: var(--muted);
  padding-top: 6px;
}
.link-grid dd {
  margin: 0;
}
@media (max-width: 640px) {
  .link-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .link-grid dd {
    margin-bottom: 4px;
  }
}
.signal-path {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-cyan);
}
.signal-path .track {
  position: relative;
  flex: 1;
  height: 4px;
  background: repeating-linear-gradient(90deg, #3a2f6b 0 6px, transparent 6px 10px);
}
.signal-path .pulse {
  position: absolute;
  top: -4px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  background: #5ff3ff;
  box-shadow: 0 0 10px #5ff3ff;
  transition: left 0.08s linear;
}
.about-screen {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 40%, #3a1a14 0%, #05030f 70%);
}
.drone-photo {
  position: relative;
  width: 160px;
  height: 100px;
  flex-shrink: 0;
  background: linear-gradient(#d8946a 0 45%, #b0603a 45% 100%);
  box-shadow: inset 0 0 0 3px #0b0816, 0 0 0 2px #5ff3ff;
  image-rendering: pixelated;
}
.drone-photo span {
  position: absolute;
  bottom: 30px;
  background: repeating-linear-gradient(170deg, #9a4a30 0 5px, #6a2e1c 5px 7px);
}
.drone-photo span:nth-child(1) {
  left: 22px;
  width: 26px;
  height: 34px;
}
.drone-photo span:nth-child(2) {
  left: 62px;
  width: 32px;
  height: 48px;
}
.drone-photo span:nth-child(3) {
  left: 108px;
  width: 24px;
  height: 24px;
}
.eng-sec {
  padding: 8px 12px;
  background: var(--panel-2);
  box-shadow: inset 2px 2px 0 #0b0816, inset -2px -2px 0 #3a2f6b;
}
.eng-list {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.eng-list > li::before {
  content: '▪ ';
  color: var(--color-cyan);
}

ndent educational project and is not an official NASA game."];var os={weather:{id:"weather",device:"WEATHER TERMINAL",title:"Weather on Mars",facts:["The air on Mars is very thin and is made mostly of carbon dioxide.","Air pressure on Mars is less than 1% of the air pressure at sea level on Earth. Scientists measure it in pascals (Pa).","Mars is cold: on most days the temperature stays far below freezing, and nights are even colder.","Wind can lift fine dust into the sky. Sometimes dust storms grow big enough to cover huge parts of the planet."],inspired:"NASA's Perseverance rover carries a weather station called MEDA. It measures air and ground temperature, wind, air pressure, humidity, dust and sunlight.",game:"Our terminal shows SIMULATED weather made for the game. It is not live data from Mars."},water:{id:"water",device:"WATER RECOVERY SYSTEM",title:"Recycling Every Drop",facts:["Water is heavy, so sending it from Earth is very expensive. Space crews recycle as much as they can.","On the International Space Station, the life support system collects used water \u2014 including moisture from the air (breath and sweat) and urine \u2014 and cleans it.","The water is filtered, treated in a hot reactor that breaks down tiny leftover chemicals, checked by sensors and made safe to drink again.","In 2023 NASA reported that the station recovers about 98% of its water. That number describes the whole recycling system working together, not one single machine."],inspired:"Inspired by the Water Recovery System that is part of the space station's life support (ECLSS).",game:"The ARES-7 recycler is fictional. Its +8 water each day is a game value."},greenhouse:{id:"greenhouse",device:"HYDROPONIC PLANTER",title:"Growing Plants in Space",facts:["Plants need water, light, the right temperature, nutrients and air to grow.","Astronauts on the International Space Station grew lettuce and other crops in a plant chamber called Veggie, lit by LED lights.","Another chamber, the Advanced Plant Habitat, is closed and automatic. Its many sensors let scientists on Earth control light, water, temperature and humidity."],inspired:"Inspired by NASA's Veggie and Advanced Plant Habitat experiments.",game:"The ARES-7 greenhouse, its plants and their growing numbers are made up for the game. A real Mars greenhouse would need to be sealed, heated and lit."},solar:{id:"solar",device:"SOLAR ARRAY",title:"Sunlight and Dust",facts:["Solar panels turn sunlight into electricity.","Mars is farther from the Sun than Earth, so sunlight there is weaker.","Dust slowly settles on solar panels and blocks sunlight. Dust reduced the power of NASA's Spirit and Opportunity rovers and of the InSight lander, which ended its mission in 2022.","Sometimes gusts of wind blew dust off the rovers' panels and their power went back up."],inspired:"Based on the real experience of NASA's solar-powered Mars missions.",game:"The dust level shown on our panels and its effect on energy are simulated for the game."},analyzer:{id:"analyzer",device:"ROCK ANALYZER",title:"Reading the Rocks",facts:["Rocks are made of minerals, and minerals are made of chemical elements like iron, silicon and magnesium.","Geologists study rocks to learn how they formed \u2014 from lava, from layers of mud, or with the help of water.","NASA's Perseverance rover collects rock cores in sealed tubes. The rover itself cannot tell whether life ever existed; samples would need study in labs on Earth."],inspired:"Inspired by two instruments on Perseverance's arm: PIXL uses X-rays to map the chemical elements in a rock, and SHERLOC uses an ultraviolet laser to identify minerals and organic molecules.",game:"The ARES-7 Rock Analyzer is fictional and every reading it shows is SIMULATED. Physical samples stay on Mars in the Lab."},drone:{id:"drone",device:"SCOUT DRONE",title:"Flying on Mars",facts:["NASA's Ingenuity helicopter made the first powered, controlled flight on another planet on April 19, 2021.","Because Martian air is so thin, Ingenuity needed big, light rotor blades spinning very fast to lift off.","Ingenuity was planned as a short technology test but flew 72 times, scouting the way for the Perseverance rover. Its mission ended in January 2024."],inspired:"Our scout drone is inspired by Ingenuity. Ingenuity carried cameras for navigation and scouting \u2014 it did not carry instruments for analyzing rocks.",game:"The ARES-7 scout drone, its battery and its flight are fictional."},comm:{id:"comm",device:"EARTH DATA LINK",title:"Talking to Earth",facts:["Radio signals travel at the speed of light: about 299,792 kilometres every second.","Mars and Earth move around the Sun, so the distance between them keeps changing. A message takes from about 3 to about 22 minutes to travel one way.","NASA talks to faraway spacecraft through the Deep Space Network: giant radio antennas in California, Spain and Australia."],inspired:"Inspired by how real Mars missions send their data home through the Deep Space Network on Earth.",game:"The ARES-7 antenna is the base's own fictional radio, not part of the Deep Space Network. The distance used for the delay is a simulated value."},radiation:{id:"radiation",device:"SUIT RADIATION MONITOR",title:"Radiation on Mars",facts:["Mars has a thin atmosphere and no global magnetic field like Earth's, so more radiation from space reaches the ground.","Radiation dose is measured in millisieverts (mSv).","NASA's Curiosity rover carries an instrument called RAD that measures radiation on the surface of Mars. RAD is a rover instrument \u2014 not something an astronaut wears.","Astronauts carry personal dosimeters that keep track of the radiation they receive."],inspired:"The outdoor dose rate in the game is based on the average surface value reported from Curiosity's RAD measurements.",game:"The ARES-7 suit monitor and all its readings are SIMULATED. Indoor and event values are made up for the game."},gravity:{id:"gravity",device:"MARS GRAVITY",title:"Lighter S
